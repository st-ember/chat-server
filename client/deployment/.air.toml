# Config file for air: https://github.com/cosmtrek/air
root = "."
tmp_dir = "tmp"

[build]
# Command to build your Go application.
# The binary will be output to the ./tmp directory.
cmd = "go build -o ./tmp/chat-client ./cmd/client"
# The path to the binary to run.
bin = "tmp/chat-client"
# Watch these file extensions.
include_ext = ["go", "toml"]
# Ignore these directories.
exclude_dir = ["vendor", "tmp"]

[misc]
# Delete the binary on exit.
clean_on_exit = true
